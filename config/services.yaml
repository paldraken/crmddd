# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:

    _instanceof:
        App\Shared\Domain\Bus\Command\CommandHandler:
            tags: [ 'crmddd.command.handler' ]

        App\Shared\Domain\Bus\Query\QueryHandler:
            tags: [ 'crmddd.command.query' ]

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones


    ### --- Controllers
    App\Controller\CompanyController:
        tags: ['controller.service_arguments']


    App\Shared\Infrastructure\Bus\Command\MySymfonyCommandBus:
        arguments: [!tagged_iterator { tag: 'crmddd.command.handler' }]

    App\Shared\Infrastructure\Bus\Query\MySymfonyQueryBus:
        arguments: [!tagged_iterator { tag: 'crmddd.command.query' }]

    App\Auth\User\Domain\UniqueUserSpecification: '@App\Auth\User\Infrastructure\DoctrineUniqueUserSpecification'


    App\Shared\Domain\Bus\Command\CommandBus: '@App\Shared\Infrastructure\Bus\Command\MySymfonyCommandBus'
    App\Shared\Domain\Bus\Query\QueryBus: '@App\Shared\Infrastructure\Bus\Query\MySymfonyQueryBus'

    # --- Auth repositories
    App\Auth\Company\Domain\CompanyRepository: '@App\Auth\Company\Infrastructure\Persistence\DoctrineCompanyRepository'
    App\Auth\User\Domain\UserRepository: '@App\Auth\User\Infrastructure\Persistence\DoctrineUserRepository'
