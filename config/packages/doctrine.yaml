doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        types:
            customer_id: App\Core\Customer\Infrastructure\Persistence\Doctrine\CustomerIdType

            company_id: App\Auth\Company\Infrastructure\Persistence\Doctrine\CompanyIdType
            user_id: App\Auth\User\Infrastructure\Persistence\Doctrine\UserIdType

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '13'
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:

            # -- Core --

            Core/Customer:
                type: xml
                prefix: App\Core\Customer\Domain
                dir: '%kernel.project_dir%/src/Core/Customer/Infrastructure/Persistence/Doctrine'
                is_bundle: false

            # -- Auth --

            Auth/Company:
                type: xml
                prefix: App\Auth\Company\Domain
                dir: '%kernel.project_dir%/src/Auth/Company/Infrastructure/Persistence/Doctrine'
                is_bundle: false

            Auth/User:
                type: xml
                prefix: App\Auth\User\Domain
                dir: '%kernel.project_dir%/src/Auth/User/Infrastructure/Persistence/Doctrine'
                is_bundle: false

